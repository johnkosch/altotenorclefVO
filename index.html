<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alto & Tenor Clef Reader</title>

<!-- Verovio -->
<script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js"></script>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f5;
    color: #222;
  }

  main {
    width: min(900px, 94vw);
    margin: 40px auto;
  }

  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: 8px;
  }

  .instructions {
    text-align: center;
    color: #555;
    margin-bottom: 28px;
  }

  #startScreen {
    text-align: center;
    padding: 60px 20px;
  }

  #startButton,
  #nextButton,
  #submitButton {
    min-height: 48px;
    padding: 10px 22px;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid #888;
    cursor: pointer;
  }

  #startButton,
  #submitButton {
    background: #222;
    color: white;
  }

  #nextButton {
    background: white;
    color: #222;
  }

  button:focus,
  input:focus {
    outline: 3px solid #2b6cb0;
    outline-offset: 2px;
  }

  #exercise {
    display: none;
  }

  .clef-label {
    text-align: center;
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 12px;
  }

  #notation {
    background: white;
    border: 1px solid #bbb;
    border-radius: 10px;
    min-height: 300px;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: auto;
  }

  /* Keep Verovio notation at a normal, readable weight/color. */
  #notation svg {
    width: 100%;
    max-width: 800px;
    height: auto;
  }

  #notation svg * {
    fill: #222 !important;
    stroke: #222 !important;
  }

  .answer-area {
    background: white;
    border: 1px solid #bbb;
    border-radius: 10px;
    margin-top: 20px;
    padding: 20px;
  }

  label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .answer-row {
    display: flex;
    gap: 10px;
  }

  #answer {
    flex: 1;
    min-width: 0;
    min-height: 52px;
    font-size: 1.5rem;
    padding: 8px 14px;
    text-align: center;
    text-transform: uppercase;
    border: 2px solid #888;
    border-radius: 8px;
  }

  #status {
    min-height: 32px;
    margin-top: 14px;
    font-size: 1.05rem;
  }

  .bottom-row {
    display: flex;
    justify-content: center;
    margin-top: 18px;
  }

  #loading {
    text-align: center;
    color: #555;
  }

  @media (max-width: 500px) {
    .answer-row {
      flex-direction: column;
    }

    #submitButton {
      width: 100%;
    }
  }
</style>
</head>

<body>
<main>
  <h1>Alto &amp; Tenor Clef Reader</h1>
  <div class="instructions">
    Read the note and enter its letter name. Octave does not matter.
  </div>

  <div style="display:flex; justify-content:center; margin-bottom:20px;">
    <label style="display:flex; align-items:center; gap:10px; font-weight:600; cursor:pointer;">
      <input
        id="voiceover"
        type="checkbox"
        checked
        style="width:20px; height:20px;"
      >
      VoiceOver
    </label>
  </div>

  <section id="startScreen" aria-label="Start screen">
    <p>Press Enter to start.</p>
    <button id="startButton" type="button">Start</button>
  </section>

  <section id="exercise" aria-label="Clef reading exercise">
    <div id="clefLabel" class="clef-label">Alto clef</div>

    <div id="loading">Loading notation…</div>
    <div id="notation" role="img" aria-label="Music notation"></div>

    <div class="answer-area">
      <form id="answerForm">
        <label for="answer">Letter name</label>

        <div class="answer-row">
          <input
            id="answer"
            type="text"
            maxlength="1"
            inputmode="text"
            autocomplete="off"
            autocapitalize="characters"
            aria-label="Enter the letter name A through G and press Enter"
          >

          <button id="submitButton" type="submit">Submit</button>
        </div>

        <div id="status" aria-live="assertive"></div>
      </form>
    </div>

  </section>
</main>

<script>
(function () {
  "use strict";

  /*
   * Staff positions are counted from the bottom upward:
   *
   * 1st line
   * 1st space
   * 2nd line
   * 2nd space
   * 3rd line
   * 3rd space
   * 4th line
   * 4th space
   * 5th line
   *
   * Alto:
   * F3 G3 A3 B3 C4 D4 E4 F4 G4
   *
   * Tenor:
   * D3 E3 F3 G3 A3 B3 C4 D4 E4
   *
   * The octave is used only to make Verovio place the note correctly.
   * Students never have to identify the octave.
   */

  const positions = [
    "1st line",
    "1st space",
    "2nd line",
    "2nd space",
    "3rd line",
    "3rd space",
    "4th line",
    "4th space",
    "5th line"
  ];

  const clefs = {
    alto: {
      label: "Alto clef",
      line: 3,
      letters: ["F","G","A","B","C","D","E","F","G"],
      pitches: [
        ["f",3],
        ["g",3],
        ["a",3],
        ["b",3],
        ["c",4],
        ["d",4],
        ["e",4],
        ["f",4],
        ["g",4]
      ]
    },

    tenor: {
      label: "Tenor clef",
      line: 4,
      letters: ["D","E","F","G","A","B","C","D","E"],
      pitches: [
        ["d",3],
        ["e",3],
        ["f",3],
        ["g",3],
        ["a",3],
        ["b",3],
        ["c",4],
        ["d",4],
        ["e",4]
      ]
    }
  };

  const startScreen = document.getElementById("startScreen");
  const startButton = document.getElementById("startButton");
  const exercise = document.getElementById("exercise");
  const clefLabel = document.getElementById("clefLabel");
  const notation = document.getElementById("notation");
  const loading = document.getElementById("loading");
  const answerForm = document.getElementById("answerForm");
  const answer = document.getElementById("answer");
  const submitButton = document.getElementById("submitButton");
  const status = document.getElementById("status");
  const voiceover = document.getElementById("voiceover");

  let toolkit = null;
  let started = false;
  let currentClef = null;
  let currentPosition = null;

  function speak(text) {
    if (!voiceover.checked) return;
    if (!("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 0.9;
    utterance.pitch = 1;

    window.speechSynthesis.speak(utterance);
  }

  function createMEI(clefName, position) {
    const clef = clefs[clefName];
    const pitch = clef.pitches[position];
    const pname = pitch[0];
    const octave = pitch[1];

    return `<?xml version="1.0" encoding="UTF-8"?>
<mei xmlns="http://www.music-encoding.org/ns/mei" meiversion="5.0">
  <meiHead>
    <fileDesc>
      <titleStmt>
        <title>Clef Reading Exercise</title>
      </titleStmt>
      <pubStmt/>
    </fileDesc>
  </meiHead>

  <music>
    <body>
      <mdiv>
        <score>
          <scoreDef meter.count="4" meter.unit="4">
            <staffGrp>
              <staffDef
                n="1"
                lines="5"
                clef.shape="C"
                clef.line="${clef.line}"
              />
            </staffGrp>
          </scoreDef>

          <section>
            <measure n="1">
              <staff n="1">
                <layer n="1">
                  <note
                    pname="${pname}"
                    oct="${octave}"
                    dur="1"
                  />
                </layer>
              </staff>
            </measure>
          </section>
        </score>
      </mdiv>
    </body>
  </music>
</mei>`;
  }

  async function initializeVerovio() {
    if (toolkit) return true;

    try {
      /*
       * The Verovio loader exposes the toolkit after its WASM module
       * initializes. Different Verovio releases expose slightly
       * different globals, so support both common forms.
       */

      if (typeof verovioToolkit !== "undefined") {
        await verovioToolkit();
      }

      if (typeof VerovioToolkit !== "undefined") {
        toolkit = new VerovioToolkit();
      } else if (
        typeof verovio !== "undefined" &&
        typeof verovio.toolkit === "function"
      ) {
        toolkit = new verovio.toolkit();
      }

      if (!toolkit) {
        throw new Error("Verovio toolkit was not available.");
      }

      toolkit.setOptions({
        scale: 90,
        pageWidth: 1000,
        pageHeight: 500,
        adjustPageHeight: true,
        breaks: "none",
        header: "none",
        footer: "none"
      });

      return true;
    } catch (error) {
      console.error(error);
      loading.textContent =
        "Verovio could not be loaded. Check your internet connection and reload the page.";
      return false;
    }
  }

  async function generateExercise(announce) {
    const ready = await initializeVerovio();

    if (!ready) return;

    currentClef = Math.random() < 0.5 ? "alto" : "tenor";
    currentPosition = Math.floor(Math.random() * positions.length);

    const clef = clefs[currentClef];
    const positionName = positions[currentPosition];

    clefLabel.textContent = clef.label;
    status.textContent = "";
    answer.value = "";

    const mei = createMEI(currentClef, currentPosition);

    try {
      toolkit.loadData(mei);

      const svg = toolkit.renderToSVG(1, {});

      notation.innerHTML = svg;
      notation.setAttribute(
        "aria-label",
        clef.label + ", note on the " + positionName
      );

      loading.style.display = "none";
    } catch (error) {
      console.error(error);
      loading.style.display = "block";
      loading.textContent = "There was an error rendering the notation.";
      return;
    }

    if (announce) {
      speak(
        clef.label +
        ". " +
        positionName +
        ". " +
        "Enter the letter name."
      );
    }

    answer.focus();
  }

  async function start() {
    if (started) return;

    started = true;
    startScreen.style.display = "none";
    exercise.style.display = "block";

    await generateExercise(true);
  }

  async function submitAnswer(event) {
    event.preventDefault();

    if (!currentClef || currentPosition === null) return;

    const value = answer.value.trim().toUpperCase();

    if (!/^[A-G]$/.test(value)) {
      status.textContent = "Enter one letter from A through G.";
      speak("Please enter one letter from A through G.");
      answer.focus();
      return;
    }

    const correct = clefs[currentClef].letters[currentPosition];

    if (value === correct) {
      status.textContent = "Correct.";
      speak("Correct. " + correct + ".");
    } else {
      status.textContent = "Incorrect. The answer is " + correct + ".";
      speak("Incorrect. The answer is " + correct + ".");
    }

    /*
     * Wait briefly so VoiceOver has time to announce the result,
     * then automatically generate the next prompt.
     */
    await new Promise(resolve => setTimeout(resolve, 900));
    await generateExercise(true);
  }

  /*
   * Enter starts the app from the start screen.
   */
  document.addEventListener("keydown", function (event) {
    if (!started && event.key === "Enter") {
      event.preventDefault();
      start();
    }
  });

  startButton.addEventListener("click", start);

  answerForm.addEventListener("submit", submitAnswer);

  /*
   * Give the start screen keyboard focus immediately.
   */
  startButton.focus();

})();
</script>

</body>
</html>
